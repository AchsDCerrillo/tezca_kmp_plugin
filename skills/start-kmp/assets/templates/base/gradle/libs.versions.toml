# Generated by tezca-kmp-development start-kmp. Versions are the pinned fallbacks from
# references/versions.md; start-kmp refreshes them to the latest compatible stable releases.
[versions]
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "28"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-datastore = "1.2.1"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.9.2"
