name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM + iOS simulator tests
        run: ./gradlew :__SDK_MODULE__:testAndroidHostTest :__SDK_MODULE__:iosSimulatorArm64Test
      - name: XCFramework builds
        run: ./gradlew :__SDK_MODULE__:assemble__SDK_NAME__DebugXCFramework
