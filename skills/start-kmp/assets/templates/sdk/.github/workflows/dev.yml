# Every push to `dev` publishes <sdkVersion>-dev.<sha>: Maven (GitHub Packages) + an XCFramework
# prerelease consumable through SPM.
name: Dev publish

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-publish
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compute version
        run: |
          BASE="$(grep '^sdkVersion=' gradle.properties | cut -d= -f2 | sed 's/-SNAPSHOT//')"
          echo "VERSION=$BASE-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Test
        run: ./gradlew :__SDK_MODULE__:testAndroidHostTest :__SDK_MODULE__:iosSimulatorArm64Test
      - name: Publish Maven (GitHub Packages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :__SDK_MODULE__:publishAllPublicationsToGitHubPackagesRepository -PsdkVersion=$VERSION
      - name: Build XCFramework
        run: ./gradlew :__SDK_MODULE__:assemble__SDK_NAME__ReleaseXCFramework -PsdkVersion=$VERSION
      - name: Publish SPM prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPM_REPO: ${{ vars.SPM_REPO }}
          SPM_REPO_TOKEN: ${{ secrets.SPM_REPO_TOKEN }}
        run: scripts/publish-spm.sh "$VERSION" "v$VERSION" --prerelease
